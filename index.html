<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./assets/imgs/favicon.png">
    <title>Pico Park Web - Multiplayer Co-op</title>
    <style>
        body {
            margin: 0;
            background: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            background: #1e293b;
            padding: 36px 40px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-sizing: border-box;
        }
        h1 {
            margin-top: 0;
            font-size: 28px;
            color: #38bdf8;
            letter-spacing: 1px;
        }
        p.subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .card {
            background: #0f172a;
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 8px 0 14px 0;
            box-sizing: border-box;
            background: #1e293b;
            border: 1px solid #475569;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            text-align: center;
            text-transform: uppercase;
        }
        input#usernameInpt {
            text-transform: none;
        }
        input:focus {
            outline: none;
            border-color: #38bdf8;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }
        .btn-primary {
            background: #0284c7;
            color: white;
            margin-bottom: 10px;
        }
        .btn-primary:hover {
            background: #0369a1;
        }
        .btn-success {
            background: #22c55e;
            color: white;
        }
        .btn-success:hover {
            background: #16a34a;
        }
        .btn-secondary {
            background: #334155;
            color: #cbd5e1;
            margin-top: 10px;
            text-decoration: none;
            display: inline-block;
        }
        .btn-secondary:hover {
            background: #475569;
            color: #fff;
        }
        label {
            display: block;
            text-align: left;
            font-size: 13px;
            color: #94a3b8;
            font-weight: 600;
        }
        .footer-links {
            margin-top: 20px;
            font-size: 14px;
        }
        .footer-links a {
            color: #38bdf8;
            text-decoration: none;
        }
        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐾 PICO PARK</h1>
        <p class="subtitle">Multiplayer Cooperative Puzzle Platformer</p>

        <div class="card">
            <label for="usernameInpt">YOUR NICKNAME</label>
            <input id="usernameInpt" type="text" placeholder="e.g. Kitty" onchange="(function(){
                localStorage.setItem('username', document.getElementById('usernameInpt').value)
            })()">
        </div>

        <button class="btn btn-primary" onclick="createRoom()">
            👑 Host New Room
        </button>

        <div class="card" style="margin-top: 16px;">
            <label for="codeinpt">ENTER 4-LETTER ROOM CODE</label>
            <input id="codeinpt" type="text" maxlength="8" placeholder="e.g. PARK">
            <button class="btn btn-success" id="joinButton" onclick="joinRoom()">
                🚀 Join Room
            </button>
        </div>

        <button class="btn btn-secondary" onclick="playSolo()">
            🎮 Play Solo / Local Co-op
        </button>

        <div class="footer-links">
            <a href="./lvl.html">🛠️ Level Editor</a>
        </div>
    </div>

    <script>
        let savedName = localStorage.getItem("username") || "Player" + Math.floor(Math.random() * 900 + 100);
        document.getElementById("usernameInpt").value = savedName;
        localStorage.setItem("username", savedName);

        function saveName() {
            let name = document.getElementById("usernameInpt").value.trim() || "Player";
            localStorage.setItem("username", name);
            return name;
        }

        function createRoom() {
            saveName();
            window.location.href = './game.html?host=true';
        }

        function joinRoom() {
            saveName();
            let code = document.getElementById("codeinpt").value.trim().toUpperCase();
            if (!code) {
                alert("Please enter a room code!");
                return;
            }
            window.location.href = `./game.html?join=${encodeURIComponent(code)}`;
        }

        function playSolo() {
            saveName();
            window.location.href = './game.html';
        }

        document.getElementById("codeinpt").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                joinRoom();
            }
        });
    </script>
</body>
</html>
